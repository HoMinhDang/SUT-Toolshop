name: Deploy Angular to GitHub Pages

on:
  workflow_dispatch:  # 👈 Cho phép chạy thủ công

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sprint5-with-bugs/UI  # ❗Sửa nếu UI ở thư mục khác

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📥 Install dependencies
        run: npm cache verify && npm install --include=optional --legacy-peer-deps

      - name: 🏗️ Build Angular
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: sprint5-with-bugs/UI/dist/toolshop
