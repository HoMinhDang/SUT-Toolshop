name: CI-BE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: testdb
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testdb
      DB_USERNAME: test
      DB_PASSWORD: test
      APP_ENV: testing

    steps:
      - name: 🧾 Checkout source code
        uses: actions/checkout@v4

      - name: 🛠 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: 📦 Install PHP dependencies
        run: |
          cd sprint5-with-bugs/API
          composer install --no-progress --prefer-dist --no-interaction

      - name: ⚙️ Prepare Laravel
        run: |
          cd sprint5-with-bugs/API
          cp .env.example .env
          php artisan key:generate
          echo "JWT_SECRET=XVVuj9s7byIX8XPNWt0aYOsFjmc4JZQmE2wR7h9IJXoEOWXwk6o6wM8AKUL7jUTy" >> .env
          php artisan config:clear
          php artisan migrate --seed


      - name: 🧪 Run Laravel Tests
        run: |
          cd sprint5-with-bugs/API
          php artisan test --debug
