name: Automated API tests using Postman CLI

on:
  push:
  workflow_dispatch:

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: |
          postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run API tests with related_data.csv
        run: |
          postman collection run "47475428-b8200262-8b6f-499e-b382-02a375f03446" \
            --env-var baseUrl=https://65c6a2e22c11.ngrok-free.app \
            --iteration-data postman/related_data.csv

      - name: Run API tests with search_data.csv
        run: |
          postman collection run "47475428-b8200262-8b6f-499e-b382-02a375f03446" \
            --env-var baseUrl=https://65c6a2e22c11.ngrok-free.app \
            --iteration-data postman/search_data.csv

      - name: Run API tests with sort_data.csv
        run: |
          postman collection run "47475428-b8200262-8b6f-499e-b382-02a375f03446" \
            --env-var baseUrl=https://65c6a2e22c11.ngrok-free.app \
            --iteration-data postman/sort_data.csv
