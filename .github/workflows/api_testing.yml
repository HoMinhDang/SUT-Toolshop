name: CI - API tests with Docker & Postman CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start containers 🐳
        run: |
          docker compose -f docker-compose.yml up -d --force-recreate

      - name: Wait for API to be ready
        run: sleep 30s

      - name: Seed database 🌱
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run Postman CLI tests (related_data.csv)
        run: |
          postman collection run postman/HW07.postman_collection.json --iteration-data postman/related_data.csv --env-var baseUrl=http://localhost:8091

      - name: Run Postman CLI tests (search_data.csv)
        run: |
          postman collection run postman/HW07.postman_collection.json --iteration-data postman/search_data.csv --env-var baseUrl=http://localhost:8091

      - name: Run Postman CLI tests (sort_data.csv)
        run: |
          postman collection run postman/HW07.postman_collection.json --iteration-data postman/sort_data.csv --env-var baseUrl=http://localhost:8091
